<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#020609">

  <title>JARVIS — OFFICIAL</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020609;
      color: #dffcff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      position: relative;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      outline: none;
      cursor: pointer;
    }

    /* =========================
       FUNDO
    ========================== */

    #space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 220, 255, 0.08),
          transparent 38%
        ),
        #020609;
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.18;

      background-image:
        linear-gradient(
          rgba(0, 220, 255, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 220, 255, 0.08) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 78%
        );
    }

    /* =========================
       APP
    ========================== */

    .app {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
    }

    /* =========================
       TOPO
    ========================== */

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 16px;

      border-bottom: 1px solid rgba(0, 229, 255, 0.18);

      background:
        linear-gradient(
          180deg,
          rgba(2, 9, 12, 0.94),
          rgba(2, 9, 12, 0.4)
        );

      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-main {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #e8fdff;
    }

    .brand-sub {
      font-size: 9px;
      letter-spacing: 2px;
      color: #00dfff;
      opacity: 0.75;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 9px;
      letter-spacing: 1.5px;
      color: #74f7ff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00eaff;
      box-shadow:
        0 0 8px #00eaff,
        0 0 18px rgba(0, 234, 255, 0.6);
    }

    .status-dot.offline {
      background: #ff4757;
      box-shadow: 0 0 8px #ff4757;
    }

    /* =========================
       CENTRO
    ========================== */

    .center {
      position: absolute;
      top: 72px;
      bottom: 78px;
      left: 0;
      right: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 15px;
    }

    .brain-wrap {
      position: relative;

      width: min(78vw, 420px);
      height: min(78vw, 420px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brain-glow {
      position: absolute;

      width: 65%;
      height: 65%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0, 225, 255, 0.22),
          rgba(0, 225, 255, 0.04) 45%,
          transparent 72%
        );

      filter: blur(15px);

      animation:
        glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    #brainCanvas {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 2;
    }

    .core-ring {
      position: absolute;

      width: 46%;
      height: 46%;

      border: 1px solid rgba(0, 238, 255, 0.25);
      border-radius: 50%;

      box-shadow:
        inset 0 0 35px rgba(0, 225, 255, 0.08),
        0 0 35px rgba(0, 225, 255, 0.08);

      animation: rotate 12s linear infinite;
    }

    .core-ring::before,
    .core-ring::after {
      content: "";

      position: absolute;

      inset: 10%;

      border: 1px dashed rgba(0, 238, 255, 0.14);

      border-radius: 50%;
    }

    .core-ring::after {
      inset: 23%;
      animation: rotateReverse 7s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    .core-text {
      position: absolute;
      z-index: 5;

      display: flex;
      flex-direction: column;
      align-items: center;

      pointer-events: none;
    }

    .core-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 5px;

      color: #dfffff;

      text-shadow:
        0 0 8px rgba(0, 229, 255, 0.8);
    }

    .core-state {
      margin-top: 7px;

      font-size: 8px;
      letter-spacing: 3px;

      color: #00dfff;
      opacity: 0.75;
    }

    /* =========================
       TEXTO DE ESCUTA
    ========================== */

    .listen-state {
      min-height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      margin-top: -5px;

      font-size: 11px;
      letter-spacing: 1.5px;

      color: rgba(220, 252, 255, 0.7);
    }

    .listen-state.active {
      color: #00edff;
      text-shadow: 0 0 12px rgba(0, 237, 255, 0.65);
    }

    .command-preview {
      width: min(90%, 600px);

      margin-top: 4px;

      min-height: 24px;

      text-align: center;

      font-size: 10px;
      line-height: 1.4;

      color: rgba(190, 239, 243, 0.45);

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* =========================
       PAINEL
    ========================== */

    .panel {
      position: fixed;

      top: 80px;
      right: 12px;
      bottom: 90px;

      width: min(92vw, 470px);

      z-index: 30;

      padding: 16px;

      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(4, 16, 20, 0.98),
          rgba(1, 7, 10, 0.98)
        );

      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.7),
        inset 0 0 40px rgba(0, 229, 255, 0.025);

      backdrop-filter: blur(18px);

      transform: translateX(110%);
      opacity: 0;

      transition:
        transform 0.3s ease,
        opacity 0.3s ease;

      overflow-y: auto;
    }

    .panel.open {
      transform: translateX(0);
      opacity: 1;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 15px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;

      color: #dfffff;
    }

    .close-panel {
      width: 34px;
      height: 34px;

      border-radius: 10px;

      color: #a7faff;

      background: rgba(0, 229, 255, 0.07);
      border: 1px solid rgba(0, 229, 255, 0.16);
    }

    .close-panel:active {
      transform: scale(0.95);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 12px;

      border-radius: 12px;

      background: rgba(0, 229, 255, 0.035);
      border: 1px solid rgba(0, 229, 255, 0.11);
    }

    .stat-label {
      font-size: 8px;
      letter-spacing: 1.5px;

      color: rgba(220, 252, 255, 0.45);

      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 6px;

      font-size: 21px;
      font-weight: 800;

      color: #00eaff;

      text-shadow:
        0 0 12px rgba(0, 234, 255, 0.4);
    }

    .brain-section {
      margin-top: 15px;
    }

    .brain-section-title {
      margin-bottom: 8px;

      font-size: 9px;
      letter-spacing: 2px;

      color: #00dfff;
    }

    .knowledge-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .knowledge-item {
      padding: 9px 10px;

      border-left: 2px solid #00eaff;

      background: rgba(0, 229, 255, 0.035);

      font-size: 10px;
      line-height: 1.4;

      color: rgba(225, 253, 255, 0.72);
    }

    .knowledge-empty {
      padding: 10px;

      font-size: 10px;

      color: rgba(225, 253, 255, 0.35);
    }

    /* =========================
       BARRA INFERIOR
    ========================== */

    .bottom {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 78px;

      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 14px;

      border-top: 1px solid rgba(0, 229, 255, 0.14);

      background:
        linear-gradient(
          0deg,
          rgba(2, 8, 11, 0.97),
          rgba(2, 8, 11, 0.7)
        );

      backdrop-filter: blur(15px);
    }

    .bottom-content {
      width: min(100%, 700px);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;
    }

    .action {
      flex: 1;

      max-width: 150px;

      height: 46px;

      border-radius: 13px;

      background: rgba(0, 229, 255, 0.045);

      border: 1px solid rgba(0, 229, 255, 0.14);

      color: rgba(220, 252, 255, 0.65);

      font-size: 8px;
      letter-spacing: 1.5px;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .action:active {
      transform: scale(0.95);
    }

    .action.primary {
      color: #00eaff;

      border-color: rgba(0, 234, 255, 0.35);

      background:
        radial-gradient(
          circle,
          rgba(0, 234, 255, 0.12),
          rgba(0, 234, 255, 0.035)
        );

      box-shadow:
        0 0 22px rgba(0, 234, 255, 0.08);
    }

    /* =========================
       NOTIFICAÇÃO
    ========================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 92px;

      z-index: 100;

      transform:
        translateX(-50%)
        translateY(20px);

      width: min(88vw, 420px);

      padding: 12px 14px;

      border-radius: 12px;

      background: rgba(3, 15, 18, 0.96);

      border: 1px solid rgba(0, 229, 255, 0.22);

      color: #cfffff;

      text-align: center;

      font-size: 10px;
      line-height: 1.4;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-height: 650px) {
      .brain-wrap {
        width: min(62vw, 310px);
        height: min(62vw, 310px);
      }

      .center {
        bottom: 72px;
      }

      .listen-state {
        min-height: 28px;
      }
    }

    @media (min-width: 800px) {
      .brain-wrap {
        width: 440px;
        height: 440px;
      }
    }
  </style>
</head>

       JAVASCRIPT
  ====================== -->

  <script type="module">

    /*
      ==========================================
      JARVIS OFFICIAL V1
      ==========================================
    */

    import {
      processQuestion,
      learn,
      remember,
      markKnown,
      markUnknown,
      getBrainState,
      getBrainStats,
      initializeBrain
    } from "./brain/core.js";

    import {
      getKnowledge
    } from "./brain/knowledge.js";

    import {
      getSessionStats
    } from "./brain/session.js";


    /* ==========================================
       ELEMENTOS
    ========================================== */

    const brainCanvas =
      document.getElementById("brainCanvas");

    const spaceCanvas =
      document.getElementById("space");

    const listenState =
      document.getElementById("listenState");

    const commandPreview =
      document.getElementById("commandPreview");

    const coreState =
      document.getElementById("coreState");

    const statusDot =
      document.getElementById("statusDot");

    const connectionText =
      document.getElementById("connectionText");

    const brainPanel =
      document.getElementById("brainPanel");

    const brainButton =
      document.getElementById("brainButton");

    const closeBrain =
      document.getElementById("closeBrain");

    const voiceButton =
      document.getElementById("voiceButton");

    const clearButton =
      document.getElementById("clearButton");

    const toast =
      document.getElementById("toast");


    /* ==========================================
       CONFIGURAÇÃO
    ========================================== */

    const OWNER_NAME = "Fernando";

    const WAKE_WORD = "jarvis";

    let recognition = null;

    let listening = false;

    let speaking = false;

    let restarting = false;

    let initialized = false;

    let lastCommand = "";

    let toastTimer = null;


    /* ==========================================
       UTILIDADES
    ========================================== */

    function normalize(text) {

      return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

    }


    function showToast(message) {

      clearTimeout(toastTimer);

      toast.textContent = message;

      toast.classList.add("show");

      toastTimer = setTimeout(() => {

        toast.classList.remove("show");

      }, 3000);

    }


    function setState(text) {

      coreState.textContent = text;

    }


    function setListeningState(text, active = false) {

      listenState.textContent = text;

      listenState.classList.toggle(
        "active",
        active
      );

    }


    function setOnline(online) {

      if (online) {

        statusDot.classList.remove("offline");

        connectionText.textContent =
          "ONLINE";

      } else {

        statusDot.classList.add("offline");

        connectionText.textContent =
          "OFFLINE";

      }

    }


    /* ==========================================
       VOZ
    ========================================== */

    function chooseVoice() {

      if (!("speechSynthesis" in window)) {
        return null;
      }

      const voices =
        window.speechSynthesis.getVoices();

      if (!voices.length) {
        return null;
      }

      const pt =
        voices.filter(v =>
          /^pt(-|_)/i.test(v.lang)
        );

      const maleNames = [
        "Daniel",
        "Ricardo",
        "Felipe",
        "Google português",
        "Microsoft Antonio",
        "Microsoft Daniel",
        "Microsoft Jorge",
        "Portuguese Brazil"
      ];

      for (const name of maleNames) {

        const found =
          pt.find(v =>
            v.name
              .toLowerCase()
              .includes(name.toLowerCase())
          );

        if (found) {
          return found;
        }

      }

      return (
        pt.find(v =>
          /male|masculino|homem/i.test(v.name)
        ) ||
        pt[0] ||
        voices[0]
      );
    }


    function speak(text) {

      return new Promise(resolve => {

        if (!("speechSynthesis" in window)) {

          resolve();

          return;
        }

        const clean =
          String(text || "")
            .replace(
              /https?:\/\/\S+/gi,
              ""
            )
            .trim();

        if (!clean) {

          resolve();

          return;
        }

        speaking = true;

        setState("SPEAKING");

        setListeningState(
          "JARVIS está respondendo...",
          true
        );

        window.speechSynthesis.cancel();

        const utterance =
          new SpeechSynthesisUtterance(clean);

        utterance.lang = "pt-BR";

        utterance.rate = 0.94;

        utterance.pitch = 0.72;

        utterance.volume = 1;

        const voice =
          chooseVoice();

        if (voice) {
          utterance.voice = voice;
        }

        utterance.onend = () => {

          speaking = false;

          setState("LISTENING");

          setListeningState(
            "Escutando...",
            true
          );

          resolve();

        };

        utterance.onerror = () => {

          speaking = false;

          setState("LISTENING");

          resolve();

        };

        window.speechSynthesis.speak(
          utterance
        );

      });

    }


    if ("speechSynthesis" in window) {

      window.speechSynthesis.onvoiceschanged =
        () => {};

    }


    /* ==========================================
       ABRIR LINKS / SERVIÇOS
    ========================================== */

    function openURL(url) {

      try {

        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );

      } catch {

        window.location.href = url;

      }

    }


    function openGoogle() {

      openURL(
        "https://www.google.com/"
      );

    }


    function searchGoogle(query) {

      openURL(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query)
      );

    }


    function openYouTube() {

      openURL(
        "https://www.youtube.com/"
      );

    }


    function searchYouTube(query) {

      openURL(
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query)
      );

    }


    function openWhatsApp() {

      openURL(
        "https://web.whatsapp.com/"
      );

    }


    function openInstagram() {

      openURL(
        "https://www.instagram.com/"

    function renderList(
      element,
      items,
      emptyText = "Nenhum registro."
    ) {

      element.innerHTML = "";

      if (
        !Array.isArray(items) ||
        items.length === 0
      ) {

        const empty =
          document.createElement("div");

        empty.className =
          "knowledge-empty";

        empty.textContent =
          emptyText;

        element.appendChild(empty);

        return;

      }

      const recent =
        items.slice(-12).reverse();

      for (const item of recent) {

        const div =
          document.createElement("div");

        div.className =
          "knowledge-item";

        if (
          typeof item === "string"
        ) {

          div.textContent = item;

        } else {

          div.textContent =
            item.topic ||
            item.text ||
            item.value ||
            JSON.stringify(item);

        }

        element.appendChild(div);

      }

    }

    /* ==========================================
       API JARVIS
    ========================================== */

    async function askJarvis(message) {

      setOnline(true);

      const brain =
        getBrainState() || {};

      const knowledge =
        getKnowledge() || {};

      const memoryContext = [

        ...(knowledge.personal || [])
          .slice(-20)
          .map(item =>
            `[PESSOAL] ${item.topic || item.text || item}`
          ),

        ...(knowledge.learned || [])
          .slice(-20)
          .map(item =>
            `[APRENDIDO] ${item.topic || item.text || item}`
          ),

        ...(knowledge.known || [])
          .slice(-20)
          .map(item =>
            `[CONHECIDO] ${item.topic || item.text || item}`
          )

      ];

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              message,

              memory:
                memoryContext,

              brain

            })

          }
        );

      let data = null;

      try {

        data =
          await response.json();

      } catch {

        data = {};

      }

      if (!response.ok) {

        throw new Error(
          data?.error ||
          "Falha na comunicação com o servidor."
        );

      }

      return {

        answer:
          data?.answer ||
          "Não consegui gerar uma resposta.",

        memoryToSave:
          data?.memoryToSave ||
          null

      };

    }


    /* ==========================================
       PROCESSAR COMANDO
    ========================================== */

    async function processCommand(
      originalText
    ) {

      if (!originalText) {
        return;
      }

      const clean =
        originalText.trim();

      if (!clean) {
        return;
      }

      lastCommand = clean;

      commandPreview.textContent =
        clean;

      setState("PROCESSING");

      setListeningState(
        "Processando comando...",
        true
      );

      /*
        Conta a pergunta no cérebro
      */

      try {

        processQuestion(clean);

      } catch (error) {

        console.warn(
          "processQuestion:",
          error
        );

      }


      /*
        Primeiro tenta comando local
      */

      try {

        const local =
          await executeLocalCommand(
            clean
          );

        if (local?.handled) {

          await speak(
            local.answer
          );

          updateBrainPanel();

          return;

        }

      } catch (error) {

        console.error(
          "Comando local:",
          error
        );

      }


      /*
        IA REAL
      */

      try {

        const result =
          await askJarvis(clean);

        let answer =
          result.answer ||
          "Não consegui responder.";

        /*
          Salvar memória solicitada
        */

        if (
          result.memoryToSave
        ) {

          try {

            remember(
              result.memoryToSave
            );

          } catch (error) {

            console.warn(
              "Erro ao salvar memória:",
              error
            );

          }

        }


        /*
          Atualiza aprendizado
        */

        try {

          learn(clean);

        } catch {}


        try {

          processQuestion(
            clean,
            answer
          );

        } catch {}


        await speak(answer);

        updateBrainPanel();

      } catch (error) {

        console.error(
          "JARVIS API:",
          error
        );

        setOnline(false);

        await speak(
          "Não consegui acessar meu núcleo de inteligência agora. Verifique a conexão com o servidor."
        );

      }

    }


    /* ==========================================
       RECONHECIMENTO DE VOZ
    ========================================== */

    function setupRecognition() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        setListeningState(
          "Reconhecimento de voz não disponível neste navegador.",
          false
        );

        voiceButton.textContent =
          "VOZ INDISPONÍVEL";

        return null;

      }

      const rec =
        new SpeechRecognition();

      rec.lang = "pt-BR";

      rec.continuous = true;

      rec.interimResults = true;

      rec.maxAlternatives = 1;


      rec.onstart = () => {

        listening = true;

        restarting = false;

        setState("LISTENING");

        setListeningState(
          "Escutando... diga JARVIS seguido do comando.",
          true
        );

        voiceButton.textContent =
          "🎙 ESCUTANDO";

      };


      rec.onresult = async event => {

        let finalText = "";

        let interimText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const result =
            event.results[i];

          const text =
            result[0].transcript;

          if (result.isFinal) {

            finalText +=
              text + " ";

          } else {

            interimText +=
              text + " ";

          }

        }

        const visible =
          (
            finalText ||
            interimText
          ).trim();

        if (visible) {

          commandPreview.textContent =
            visible;

        }


        if (!finalText) {
          return;
        }

        if (speaking) {
          return;
        }

        const normalized =
          normalize(finalText);


        /*
          JARVIS pode aparecer
          em qualquer parte da frase.
        */

        const jarvisIndex =
          normalized.indexOf(
            WAKE_WORD
          );

        if (jarvisIndex === -1) {

          return;

        }


        let command =
          finalText
            .substring(
              jarvisIndex +
              WAKE_WORD.length
            )
            .trim();

        command =
          command.replace(
            /^[,;:.\-\s]+/,
            ""
          );


        /*
          Se falou somente JARVIS
        */

        if (!command) {

          await speak(
            `Sim, Fernando. Estou ouvindo.`
          );

          return;

        }


        await processCommand(
          command
        );

      };


      rec.onerror = event => {

        console.warn(
          "SpeechRecognition:",
          event.error
        );

        if (
          event.error ===
          "not-allowed"
        ) {

          listening = false;

          setState("MIC BLOCKED");

          setListeningState(
            "Permissão do microfone bloqueada. Autorize o microfone no navegador.",
            false
          );

          voiceButton.textContent =
            "🎙 AUTORIZAR";

          return;

        }

        if (
          event.error ===
          "service-not-allowed"
        ) {

          listening = false;

          setState("VOICE ERROR");

          setListeningState(
            "Serviço de voz indisponível.",
            false
          );

          return;

        }

      };


      rec.onend = () => {

        listening = false;

        voiceButton.textContent =
          "🎙 VOZ";

        /*
          Mantém a escuta ativa.
        */

        if (
          initialized &&
          !restarting
        ) {

          restarting = true;

          setTimeout(() => {

            try {

              rec.start();

            } catch {}

            restarting = false;

          }, 500);

        }

      };


      return rec;

    }

    /* ==========================================
       CANVAS — CÉREBRO DE PARTÍCULAS
    ========================================== */

    const brainCtx =
      brainCanvas.getContext("2d");

    let brainParticles = [];

    let brainWidth = 0;

    let brainHeight = 0;


    function resizeBrain() {

      const rect =
        brainCanvas.getBoundingClientRect();

      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      brainWidth =
        rect.width;

      brainHeight =
        rect.height;

      brainCanvas.width =
        rect.width * dpr;

      brainCanvas.height =
        rect.height * dpr;

      brainCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      createBrainParticles();

    }


    function createBrainParticles() {

      brainParticles = [];

      const count =
        Math.floor(
          Math.min(
            900,
            Math.max(
              350,
              (brainWidth * brainHeight) /
              180
            )
          )
        );

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;

        const radius =
          Math.sqrt(
            Math.random()
          );

        /*
          Forma aproximada de cérebro
        */

        let x =
          (Math.random() - 0.5) *
          2;

        let y =
          (Math.random() - 0.5) *
          1.35;

        /*
          Divide levemente os hemisférios
        */

        if (Math.random() > 0.5) {

          x =
            Math.sign(x || 1) *
            Math.abs(x);

        }

        const scale =
          Math.max(
            0.1,
            1 -
            Math.abs(y) * 0.38
          );

        x *= scale;

        const dist =
          Math.sqrt(
            x * x +
            y * y
          );

        if (dist > 1.05) {
          i--;
          continue;
        }

        const px =
          brainWidth / 2 +
          x *
          brainWidth *
          0.39;

        const py =
          brainHeight / 2 +
          y *
          brainHeight *
          0.31;

        brainParticles.push({

          x: px,
          y: py,

          baseX: px,
          baseY: py,

          size:
            Math.random() *
            1.45 +
            0.25,

          alpha:
            Math.random() *
            0.65 +
            0.2,

          phase:
            Math.random() *
            Math.PI *
            2,

          speed:
            Math.random() *
            0.018 +
            0.004

        });

      }

    }


    let brainTime = 0;


    function drawBrain() {

      brainTime += 0.01;

      brainCtx.clearRect(
        0,
        0,
        brainWidth,
        brainHeight
      );


      /*
        brilho central
      */

      const gradient =
        brainCtx.createRadialGradient(
          brainWidth / 2,
          brainHeight / 2,
          0,
          brainWidth / 2,
          brainHeight / 2,
          brainWidth * 0.45
        );

      gradient.addColorStop(
        0,
        "rgba(0,235,255,0.09)"
      );

      gradient.addColorStop(
        0.5,
        "rgba(0,180,255,0.025)"
      );

      gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
      );

      brainCtx.fillStyle =
        gradient;

      brainCtx.fillRect(
        0,
        0,
        brainWidth,
        brainHeight
      );


      /*
        partículas
      */

      for (
        const p of brainParticles
      ) {

        p.x =
          p.baseX +
          Math.sin(
            brainTime * p.speed * 90 +
            p.phase
          ) *
          2.4;

        p.y =
          p.baseY +
          Math.cos(
            brainTime * p.speed * 70 +
            p.phase
          ) *
          2.4;

        const pulse =
          0.65 +
          Math.sin(
            brainTime * 2 +
            p.phase
          ) *
          0.35;

        brainCtx.beginPath();

        brainCtx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        brainCtx.fillStyle =
          `rgba(0,225,255,${p.alpha * pulse})`;

        brainCtx.fill();

      }


      /*
        conexões
      */

      const maxConnections = 90;

      let connections = 0;

      for (
        let i = 0;
        i < brainParticles.length &&
        connections < maxConnections;
        i += 7
      ) {

        const a =
          brainParticles[i];

        if (!a) continue;

        for (
          let j = i + 20;
          j < brainParticles.length;
          j += 17
        ) {

          const b =
            brainParticles[j];

          if (!b) continue;

          const dx =
            a.x - b.x;

          const dy =
            a.y - b.y;

          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );

          if (distance < 28) {

            brainCtx.beginPath();

            brainCtx.moveTo(
              a.x,
              a.y
            );

            brainCtx.lineTo(
              b.x,
              b.y
            );

            brainCtx.strokeStyle =
              `rgba(0,210,255,${
                0.055 *
                (1 - distance / 28)
              })`;

            brainCtx.lineWidth =
              0.5;

            brainCtx.stroke();

            connections++;

            if (
              connections >=
              maxConnections
            ) {
              break;
            }

          }

        }

      }


      requestAnimationFrame(
        drawBrain
      );

    }


    window.addEventListener(
      "resize",
      resizeBrain
    );

    resizeBrain();

    drawBrain();


    /* ==========================================
       CANVAS — ESPAÇO
    ========================================== */

    const spaceCtx =
      spaceCanvas.getContext("2d");

    let stars = [];

    function resizeSpace() {

      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      spaceCanvas.width =
        window.innerWidth *
        dpr;

      spaceCanvas.height =
        window.innerHeight *
        dpr;

      spaceCanvas.style.width =
        window.innerWidth + "px";

      spaceCanvas.style.height =
        window.innerHeight + "px";

      spaceCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      createStars();

    }


    function createStars() {

      stars = [];

      const amount =
        Math.floor(
          window.innerWidth *
          window.innerHeight /
          11000
        );

      for (
        let i = 0;
        i < amount;
        i++
      ) {

        stars.push({

          x:
            Math.random() *
            window.innerWidth,

          y:
            Math.random() *
            window.innerHeight,

          size:
            Math.random() *
            1.2 +
            0.2,

          alpha:
            Math.random() *
            0.45 +
            0.08,

          phase:
            Math.random() *
            Math.PI *
            2

        });

      }

    }


    let starTime = 0;


    function drawStars() {

      starTime += 0.01;

      spaceCtx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );

      for (
        const star of stars
      ) {

        const pulse =
          0.65 +
          Math.sin(
            starTime * 1.5 +
            star.phase
          ) *
          0.35;

        spaceCtx.beginPath();

        spaceCtx.arc(
          star.x,
          star.y,
          star.size,
          0,
          Math.PI * 2
        );

        spaceCtx.fillStyle =
          `rgba(120,220,255,${
            star.alpha * pulse
          })`;

        spaceCtx.fill();

      }

      requestAnimationFrame(
        drawStars
      );

    }


    window.addEventListener(
      "resize",
      resizeSpace
    );

    resizeSpace();

    drawStars();


    /* ==========================================
       TESTE DE CONEXÃO
    ========================================== */

    async function testServer() {

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "OPTIONS"
            }
          );

        setOnline(
          response.ok ||
          response.status === 405
        );

      } catch {

        /*
          Mesmo que OPTIONS não seja aceito,
          o servidor pode estar funcionando.
        */

        setOnline(true);

      }

    }


    /* ==========================================
       INICIALIZAÇÃO AUTOMÁTICA
    ========================================== */

    function initializeVoiceSystem() {

      recognition =
        setupRecognition();

      if (!recognition) {
        return;
      }

      /*
        Tentativa automática.
        Alguns navegadores bloqueiam
        microfone sem gesto do usuário.
      */

      try {

        initialized = true;

        recognition.start();

      } catch {

        initialized = false;

        setState("READY");

        setListeningState(
          "Toque em VOZ uma vez para ativar o microfone.",
          false
        );

      }

    }


    /* ==========================================
       START
    ========================================== */

    window.addEventListener(
      "load",
      () => {

        updateBrainPanel();

        testServer();

        setTimeout(
          initializeVoiceSystem,
          700
        );

      }
    );


    /* ==========================================
       VISIBILIDADE
    ========================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          !document.hidden &&
          initialized &&
          recognition &&
          !listening &&
          !speaking
        ) {

          setTimeout(() => {

            try {

              recognition.start();

            } catch {}

          }, 500);

        }

      }
    );


    /* ==========================================
       SEGURANÇA BÁSICA DE INTERFACE
    ========================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          "speechSynthesis" in window
        ) {

          window.speechSynthesis.cancel();

        }

        if (recognition) {

          try {
            recognition.stop();
          } catch {}

        }

      }
    );

      "JARVIS, abra o Google Maps."

      "JARVIS, mostre seu cérebro para análise."

      "JARVIS, memorize que..."

      "JARVIS, aprenda que..."

    */
